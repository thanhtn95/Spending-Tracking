services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spending
      POSTGRES_PASSWORD: spending_dev_password
      POSTGRES_DB: spending_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spending -d spending_tracker"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://spending:spending_dev_password@db:5432/spending_tracker
      GEMINI_API_KEY: ${GEMINI_API_KEY:-replace_with_real_gemini_key}
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_secret_change_in_prod_32chars_min}
      JWT_EXPIRATION_HOURS: 168
      ALLOW_REGISTRATION: "true"
      DEFAULT_CURRENCY: VND
      RUN_MIGRATIONS: "true"
      PORT: 8080
      RUST_LOG: spending_tracker_api=info,tower_http=info

volumes:
  pgdata:
